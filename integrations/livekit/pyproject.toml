[project]
name = "voicebox-livekit"
version = "0.1.0"
description = "LiveKit Agents STT and TTS plugins for a local Voicebox server"
requires-python = ">=3.10,<3.15"
dependencies = [
    "livekit-agents~=1.8",
    "aiohttp>=3.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The example agent: local Silero VAD and an OpenAI-compatible local LLM (Ollama).
example = [
    "livekit-agents[silero,openai]~=1.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebox_livekit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
