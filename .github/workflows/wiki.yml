name: Publish wiki

# Converts docs/content to Markdown and pushes it to the GitHub wiki.
# The wiki repo must exist first: create any page once in the GitHub web UI.

on:
  push:
    branches:
      - main
    paths:
      - docs/content/**
      - docs/public/images/**
      - docs/scripts/build-wiki.mjs
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Build wiki pages
        run: node docs/scripts/build-wiki.mjs wiki-out

      - name: Push to wiki
        run: |
          rsync -a --delete --exclude .git wiki-out/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Wiki is up to date" && exit 0
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
