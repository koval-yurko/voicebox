name: Publish wiki

# Copies docs/ (GitHub wiki Markdown) to the GitHub wiki.
# docs/ is the source: edits made in the wiki web editor are overwritten.

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Push to wiki
        run: |
          rsync -a --delete --exclude .git docs/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Wiki is up to date" && exit 0
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
